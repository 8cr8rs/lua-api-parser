[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lua-api-parser"
version = "0.1.0"
description = "A CLI to convert JSON docs from Lua-based APIs into lua_ls/EmmyLua LSP parsable type definitions."
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "eightcraters", email = "eightcraters@hotmail.com" }]
maintainers = []
requires-python = ">=3.10"
keywords = [
  "cli",
  "lua",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# ============
# Dependencies
# ============

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=7.0"]

[project.urls]
# Replace <project> with repository name
Repository = "https://github.com/8cr8rs/lua-api-parser"
Documentation = "https://github.com/8cr8rs/lua-api-parser#readme"
Issues = "https://github.com/8cr8rs/lua-api-parser/issues"

[tool.pyright]
# Prevents the forced assign to unused variable warning
reportUnusedCallResult = "none"
# Any is used for JSON objects due to ambiguity
reportExplicitAny = "none"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Sorted imports
ignore = ["I001"]
